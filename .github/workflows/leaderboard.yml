name: Update Leaderboard

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh leaderboard table in README
        run: |
          python3 - <<'EOF'
          import json, urllib.request, io, re, datetime
          URL = "https://bed-bounce-lb-default-rtdb.asia-southeast1.firebasedatabase.app/scores.json"
          data = json.load(urllib.request.urlopen(URL)) or {}
          rows = sorted(data.items(), key=lambda kv: kv[1].get("score", 0), reverse=True)[:10]
          medals = ["\U0001F947", "\U0001F948", "\U0001F949"]
          lines = ["<table>", '<tr><th>#</th><th width="44%">Player</th><th>Score</th><th>Prize</th><th>Icon</th></tr>']
          prizes = ["$50", "$30", "$20"]
          badgeurls = ["https://raw.githubusercontent.com/XDOTDEX/Fuckgames/main/avatars/badge1.svg", "https://raw.githubusercontent.com/XDOTDEX/Fuckgames/main/avatars/badge2.svg", "https://raw.githubusercontent.com/XDOTDEX/Fuckgames/main/avatars/badge3.svg"]
          bossurl = "https://raw.githubusercontent.com/XDOTDEX/Fuckgames/main/avatars/badgeboss.svg"
          for i, (k, r) in enumerate(rows):
              rank = medals[i] if i < 3 else str(i + 1)
              name = str(r.get("name", "Player")).replace("|", " ").strip() or "Player"
              photo = str(r.get("photo", "")).replace('"', "").replace("<", "").replace(">", "").strip()
              name_html = name.replace(" ", "&nbsp;")
              if photo:
                  cell = '<img src="%s" width="24" height="24" alt=""> %s' % (photo, name_html)
              else:
                  cell = name_html
              prize = prizes[i] if i < 3 else "$0"
              icon = ""
              if i < 3:
                  icon += '<img src="%s" width="22" height="22" alt="">' % badgeurls[i]
              if k == "tg_5855933091":
                  icon += '<img src="%s" width="22" height="22" alt="">' % bossurl
              lines.append("<tr><td>%s</td><td>%s</td><td>%s</td><td>%s</td><td>%s</td></tr>" % (rank, cell, r.get("score", 0), prize, icon if icon else "-"))
          if not rows:
              lines.append('<tr><td colspan="5">No scores yet - be the first!</td></tr>')
          lines.append("</table>")
          dhaka = datetime.datetime.utcnow() + datetime.timedelta(hours=6)
          table = "\n".join(lines) + "\n\n_Last updated: %s (Dhaka time) - refreshes every ~5 minutes._" % dhaka.strftime("%d %b %Y, %H:%M")
          add = (6 - dhaka.weekday()) % 7
          end_dt = datetime.datetime(dhaka.year, dhaka.month, dhaka.day, 23, 59, 59) + datetime.timedelta(days=add)
          if end_dt <= dhaka:
              end_dt += datetime.timedelta(days=7)
          rem = end_dt - dhaka
          rs = int(rem.total_seconds())
          gline = "⏳ **Time left this week: %dd %02d:%02d:%02d** - ends **Sunday, %s, 11:59 PM (Dhaka time)**" % (rs // 86400, (rs % 86400) // 3600, (rs % 3600) // 60, rs % 60, end_dt.strftime("%d %B %Y"))
          readme = io.open("README.md", encoding="utf-8").read()
          new = re.sub(r"<!-- LEADERBOARD:START -->.*?<!-- LEADERBOARD:END -->",
                       "<!-- LEADERBOARD:START -->\n" + table + "\n<!-- LEADERBOARD:END -->",
                       readme, flags=re.S)
          new = re.sub(r"<!-- GIVEAWAY:START -->.*?<!-- GIVEAWAY:END -->",
                       "<!-- GIVEAWAY:START -->\n" + gline + "\n<!-- GIVEAWAY:END -->",
                       new, flags=re.S)
          if new != readme:
              io.open("README.md", "w", encoding="utf-8").write(new)
              print("leaderboard updated")
          else:
              print("no change")
          EOF

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes."
          else
            git config user.name "leaderboard-bot"
            git config user.email "actions@github.com"
            git add README.md
            git commit -m "Update leaderboard"
            git push
          fi
